# Scans internal Markdown links under _docs/ against the tree and assets/js/broken_redirect_list.js.
# Same logic as ./bdocs fblinks (scripts/find_broken_links.ts).
name: Broken internal links

on:
  pull_request:
    paths:
      - "_docs/**"
      - "assets/js/broken_redirect_list.js"
      - "scripts/find_broken_links.ts"
      - ".github/workflows/broken-links.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: broken-links-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  broken-links:
    name: Broken internal links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Scan for broken internal links
        id: fblinks
        run: npm run fblinks

      - name: Upload broken-links CSV
        # Avoid a second failure when npm ci fails (no CSV yet); only attach when the scan step failed.
        if: failure() && steps.fblinks.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: broken-links
          path: scripts/temp/broken-links.csv
