# Nightly sitemap last-modified update.
#
# Runs on a schedule just before the nightly deploy, checks out develop, and
# commits any changed _data/sitemap_*.json files directly to develop. This
# ensures up-to-date lastmod dates land in every nightly release without
# polluting PR history with bot commits or breaking on fork PRs.
#
# Also supports manual dispatch (workflow_dispatch) for ad-hoc runs.

name: "Nightly sitemap last-modified update"

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 11pm PT / 2am ET Sun–Thu nights (Mon–Fri UTC), 1h before nightly deploy
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Prevent overlapping nightly runs from racing to push to develop.
concurrency:
  group: nightly-sitemap-update
  cancel-in-progress: false

jobs:
  update-sitemaps:
    name: "Update sitemap last-modified dates"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout develop"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: develop
          fetch-depth: 0

      - name: "Set up Ruby"
        uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64  # v1.299.0
        with:
          ruby-version: "3.3"

      - name: "Update sitemaps"
        run: ruby scripts/generate_sitemap_lastmodified.rb all

      - name: "Commit sitemap updates"
        run: |
          if [ -n "$(git status --porcelain _data/sitemap_*.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/sitemap_*.json
            git commit -m "chore: nightly sitemap last-modified update"
            git pull --rebase origin develop
            git push origin develop
          else
            echo "No sitemap changes to commit."
          fi

      - name: "Open issue on failure"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Nightly sitemap update failed ($(date -u +'%Y-%m-%d'))" \
            --body "The nightly sitemap last-modified update failed. Check the run log for details.

**Run:** ${RUN_URL}

Common causes: rebase conflict on \`develop\`, push failure, or Ruby script error."
