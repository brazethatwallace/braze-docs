# Checks that every table in changed Markdown files has an accessible name.
# Tables must have one of:
#   - A Kramdown IAL with aria-label= (markdown tables)
#   - A Kramdown IAL with role="presentation" or role="none" (explicit layout-table opt-out)
#   - aria-label= or aria-labelledby= on the <table> tag (HTML tables)
#   - <caption> as the first child element (HTML tables)
#
# On failure: posts inline review suggestions the writer can commit with one click.
# On pass: removes any previous failure comment.
#
# Fix guidance is also printed inline. Run locally:
#   python3 scripts/check_table_accessibility.py            # scan all _docs/ and _includes/
#   python3 scripts/check_table_accessibility.py path/to/file.md   # scan specific file(s)

name: Check table accessibility

on:
  pull_request:
    paths:
      - "_docs/**/*.md"
      - "_includes/**/*.md"
      - "scripts/check_table_accessibility.py"
      - ".github/workflows/check-table-accessibility.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  check-table-accessibility:
    name: Table accessible names (changed Markdown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch for three-dot diff
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Get changed Markdown files
        id: changed
        shell: bash
        run: |
          BASE="origin/${{ github.base_ref }}"
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMRT "$BASE"...HEAD \
              -- '_docs/**' '_includes/**' \
            | grep -E '\.md$' \
            | grep -v '^_docs/_hidden/' \
            || true
          )
          if ((${#FILES[@]} == 0)); then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "No changed Markdown files to check."
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${FILES[@]}" > /tmp/changed_files.txt
          echo "Checking ${#FILES[@]} file(s):"
          printf '  %s\n' "${FILES[@]}"

      - name: Check table accessible names
        id: lint
        if: steps.changed.outputs.ran == 'true'
        shell: bash
        run: |
          set +e
          mapfile -t FILES < /tmp/changed_files.txt
          python3 scripts/check_table_accessibility.py \
            --json violations.json \
            "${FILES[@]}" 2>&1 | tee lint-output.txt
          LINT_EXIT=${PIPESTATUS[0]}
          echo "exit_code=${LINT_EXIT}" >> "$GITHUB_OUTPUT"
          exit "${LINT_EXIT}"

      - name: Post inline suggestions and sync PR comment
        if: always() && steps.changed.outputs.ran == 'true'
        uses: actions/github-script@v9
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- braze-docs-table-a11y-bot -->';
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const headSha = process.env.HEAD_SHA;

            // --- Helper: find or update/delete the summary comment ---
            async function syncSummaryComment(body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));

              if (!body) {
                if (existing) {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                  core.info(`Deleted resolved table-accessibility comment ${existing.id}`);
                }
                return;
              }
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                core.info(`Updated table-accessibility comment ${existing.id}`);
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                core.info('Created table-accessibility comment');
              }
            }

            if (process.env.LINT_OUTCOME === 'success' || process.env.LINT_OUTCOME === 'skipped') {
              await syncSummaryComment(null);
              return;
            }

            // --- Parse violations ---
            const fs = require('fs');
            let violations = [];
            try {
              violations = JSON.parse(fs.readFileSync('violations.json', 'utf8'));
            } catch (e) {
              core.warning('Could not read violations.json: ' + e.message);
            }

            // --- Post inline suggestions ---
            let suggested = 0;
            const fallback = [];

            for (const v of violations) {
              // Build the suggestion body. GitHub renders ```suggestion blocks as
              // one-click "Commit suggestion" buttons in the PR UI.
              const suggestionBody =
                '```suggestion\n' + v.suggestion_content + '\n```';

              try {
                await github.rest.pulls.createReviewComment({
                  owner,
                  repo,
                  pull_number: prNumber,
                  commit_id: headSha,
                  path: v.file,
                  line: v.suggestion_line,
                  side: 'RIGHT',
                  body: suggestionBody,
                });
                suggested++;
              } catch (e) {
                // Line is not in the diff (e.g. context-only change) — fall back to comment
                core.info(`Could not post inline suggestion for ${v.file}:${v.suggestion_line} — ${e.message}`);
                fallback.push(v);
              }
            }

            // --- Build summary comment ---
            const lines = [marker, ''];

            if (suggested > 0 && fallback.length === 0) {
              lines.push('### Table accessibility: suggestions posted');
              lines.push('');
              lines.push(
                `${suggested} table${suggested !== 1 ? 's are' : ' is'} missing an accessible name. ` +
                `Inline suggestions have been posted — look for the **"Commit suggestion"** button on each flagged line, or apply them all at once with **"Commit all suggestions"** at the top of the Files changed tab.`
              );
            } else if (suggested > 0 && fallback.length > 0) {
              lines.push('### Table accessibility: some suggestions posted');
              lines.push('');
              lines.push(
                `${suggested} inline suggestion${suggested !== 1 ? 's were' : ' was'} posted (look for **"Commit suggestion"** in the Files changed tab). ` +
                `${fallback.length} additional violation${fallback.length !== 1 ? 's' : ''} could not be posted inline (the affected lines are outside the diff) — fix these manually:`
              );
              lines.push('');
              for (const v of fallback) {
                lines.push(`- **\`${v.file}:${v.table_start_line}\`**: ${v.message}`);
                lines.push(`  \`\`\`\n  ${v.fix_hint}\n  \`\`\``);
              }
            } else {
              // No inline suggestions posted — show all as manual fixes
              lines.push('### Table accessibility check failed');
              lines.push('');
              lines.push(
                `${violations.length} table${violations.length !== 1 ? 's are' : ' is'} missing an accessible name. ` +
                'Fix each one before merging:'
              );
              lines.push('');
              for (const v of violations) {
                lines.push(`- **\`${v.file}:${v.table_start_line}\`**: ${v.message}`);
                lines.push(`  \`\`\`\n  ${v.fix_hint}\n  \`\`\``);
              }
              lines.push('');
              lines.push('**For markdown tables**, add a Kramdown IAL immediately after the last row:');
              lines.push('```markdown');
              lines.push('| Col 1 | Col 2 |');
              lines.push('| --- | --- |');
              lines.push('| Cell | Cell |');
              lines.push('{: .reset-td-br-1 .reset-td-br-2 aria-label="Your descriptive label" }');
              lines.push('```');
              lines.push('');
              lines.push('**Genuine layout tables** can opt out with `role="presentation"` in the IAL.');
            }

            await syncSummaryComment(lines.join('\n'));
