# Weekly drift report: compare Phrase-synced glossaries against product repos.
#
# scripts/glossaries/*.json are synced from Phrase (see sync-glossaries-from-phrase.yml).
# This workflow flags mismatches vs platform dashboard, Android/Swift SDK, and GrapesJS
# locale files so teams can reconcile Phrase vs in-product strings.
name: Audit glossaries

on:
  schedule:
    - cron: '0 6 * * 0'   # Every Sunday at 06:00 UTC (after Phrase sync)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout braze-docs
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Clone reference repos
        env:
          GH_TOKEN: ${{ secrets.REFERENCE_REPO_TOKEN }}
        run: |
          clone_repo() {
            local org=$1 repo=$2
            echo "Cloning $org/$repo..."
            git clone --depth 1 --filter=blob:none --sparse \
              "https://x-access-token:${GH_TOKEN}@github.com/${org}/${repo}.git" \
              "../${repo}" 2>/dev/null || \
            git clone --depth 1 \
              "https://github.com/${org}/${repo}.git" \
              "../${repo}" 2>/dev/null || \
            echo "  WARNING: Could not clone ${org}/${repo} — skipping"
          }

          clone_repo Appboy platform
          clone_repo braze-inc braze-android-sdk
          clone_repo braze-inc braze-swift-sdk
          clone_repo braze-inc grapesjs

          for repo in platform braze-android-sdk braze-swift-sdk grapesjs; do
            if [ -d "../${repo}" ]; then
              cd "../${repo}"
              git sparse-checkout init --cone 2>/dev/null || true
              case $repo in
                platform)
                  git sparse-checkout set dashboard/config/locales 2>/dev/null || true ;;
                braze-android-sdk)
                  git sparse-checkout set android-sdk-ui/src/main/res 2>/dev/null || true ;;
                braze-swift-sdk)
                  git sparse-checkout set Sources/BrazeUI/Resources/Localization 2>/dev/null || true ;;
                grapesjs)
                  git sparse-checkout set src/i18n/locale 2>/dev/null || true ;;
              esac
              cd "$GITHUB_WORKSPACE"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit glossaries (report only)
        id: audit
        run: |
          python scripts/audit_glossaries.py \
            --platform-repo ../platform \
            --android-repo ../braze-android-sdk \
            --swift-repo ../braze-swift-sdk \
            --grapesjs-repo ../grapesjs \
            --output scripts/glossary_audit_reports/latest.json

      - name: Ensure labels exist
        if: >-
          (steps.audit.outputs.total_mismatches != '' && steps.audit.outputs.total_mismatches != '0') ||
          (steps.audit.outputs.total_missing != '' && steps.audit.outputs.total_missing != '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "glossary-audit" --description "Glossary drift report" --color "FBCA04" --force

      - name: Create pull request
        if: >-
          (steps.audit.outputs.total_mismatches != '' && steps.audit.outputs.total_mismatches != '0') ||
          (steps.audit.outputs.total_missing != '' && steps.audit.outputs.total_missing != '0')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: glossary-audit/${{ github.run_id }}
          base: develop
          title: "Glossary drift report: Phrase glossaries vs product repos"
          body-path: scripts/glossary_audit_reports/latest.md
          labels: |
            glossary-audit
          commit-message: "chore: glossary drift report"
          delete-branch: true
          add-paths: |
            scripts/glossary_audit_reports/
