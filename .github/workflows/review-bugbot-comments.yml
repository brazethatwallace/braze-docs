# Evaluates Cursor Bugbot review comments on auto-translation PRs using Claude.
# Applies valid fixes, updates glossaries, and posts a summary.
#
# Triggered when Bugbot submits a review on a PR with the 'auto-translation' label.
# After evaluation, swaps "In Review" → "status: done" to signal human readiness.
name: Review Bugbot comments

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  review-bugbot:
    if: >-
      github.event.review.user.login == 'cursor[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'auto-translation') &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'auto-translate/')
    runs-on: ubuntu-latest
    concurrency:
      group: bugbot-review-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Evaluate Bugbot comments
        id: review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/review_bugbot.py

      - name: Commit and push fixes
        if: steps.review.outputs.fixes_applied != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _lang/ scripts/glossaries/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "fix: apply Bugbot review suggestions (automated)"
          git push

      - name: Post summary comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f bugbot_review_summary.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body-file bugbot_review_summary.md
          fi

      - name: Update labels
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "In Review" \
            --add-label "status: done"
