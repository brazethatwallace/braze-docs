name: Add Reviewers

on:
  pull_request:
    types: [opened, edited, ready_for_review, labeled, unlabeled]

jobs:
  add-reviewers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check assignees and PR diff
        id: check
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prBody = (pr.body || '').toLowerCase();
            const assignees = pr.assignees.map(a => a.login.toLowerCase());
            
            console.log('PR Number:', prNumber);
            console.log('Assignees:', assignees);
            console.log('PR Body:', prBody);
            
            let reviewersToAdd = [];
            const labels = (pr.labels || []).map(l => l.name.toLowerCase());
            const legalTeam = 'ats-91';
            let scanIncomplete = false;
            const isDeployPR = labels.includes('deploy');

            // Deploy PRs: docs-team is added in the follow-up step (needs GH_TOKEN).
            if (isDeployPR) {
              console.log('Deploy PR - docs-team will be added in follow-up step');
            } else {
            // If PR diff contains privacy/legal/GDPR keywords, add legal reviewer
            let diff = '';

            try {
              const diffData = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                mediaType: { format: 'diff' }
              });
              diff = (diffData.data || '').toLowerCase();
            } catch (err) {
              if (err.message?.includes('300') || err.message?.includes('too_large')) {
                console.log('Diff exceeded 300 files, falling back to listFiles (scan may miss binary/truncated content)');
                scanIncomplete = true;
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });
                const filesWithoutPatch = files.filter(f => !f.patch).length;
                if (filesWithoutPatch > 0) {
                  console.log(`${filesWithoutPatch} file(s) have no patch (binary or omitted) - legal scan may be incomplete`);
                }
                diff = files.map(f => f.patch || '').filter(Boolean).join('\n').toLowerCase();
              } else {
                throw err;
              }
            }
            const keywords = [
              'law',
              'laws',
              'regulation',
              'regulations',
              'privacy',
              'personal data',
              'personally identifiable information',
              'pii',
              'legal',
              'contract',
              'msa',
              'data processing addendum',
              'dpa',
              'gdpr',
              'ccpa',
              'tcpa',
              'hipaa',
              'coppa',
              'compliance',
              'comply',
              'compliant',
              'jurisdiction',
              'confidentiality',
              'cookie',
              'consent',
              'personal information',
              'phi',
              'opt-in',
              'opt in',
              'opt-out',
              'opt out',
              'spam',
              'can-spam',
              'casl',
              'liability',
              'liable',
              'tracking',
              'governance',
              'agreement',
              'notice',
              'policy',
              'subscribe',
              'subscription',
              'subscribed',
              'directive',
              'directives'];

            const escapeRegex = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const containsKeyword = keywords.some(keyword => {
              // If the keyword contains a space or hyphen, do a simple case-insensitive substring match
              if (/\s|-/.test(keyword)) {
                return diff.includes(keyword.toLowerCase());
              } else {
                // Single word: use word boundaries
                return new RegExp(`\\b${escapeRegex(keyword)}\\b`, 'i').test(diff);
              }
            });
            
            if (containsKeyword) {
              console.log('Found privacy/legal/GDPR keyword in diff - adding legal team');
              reviewersToAdd.push(legalTeam);
            } else if (scanIncomplete) {
              console.log('Scan incomplete (fallback used) - adding legal team as precaution');
              reviewersToAdd.push(legalTeam);
            }
            }

            // Get current reviewers to avoid duplicates
            const { data: currentReviewers } = await github.rest.pulls.listRequestedReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const existingReviewers = currentReviewers.users.map(u => u.login);
            
            console.log('Existing reviewers:', existingReviewers);
            
            reviewersToAdd = reviewersToAdd.filter(r => !existingReviewers.includes(r));
            
            console.log('Reviewers to add:', reviewersToAdd);
            
            if (reviewersToAdd.length > 0) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: reviewersToAdd
                });
                
                console.log('Successfully added reviewers');
                
                let commentBody = '🤖 **Automated Reviewer Assignment**: I have automatically added reviewers based on the following:\n\n';
                
                if (reviewersToAdd.includes(legalTeam)) {
                  const legalReason = scanIncomplete
                    ? 'PR is large; legal scan may be incomplete (binary/truncated content not scanned)'
                    : 'PR diff contains privacy/legal/GDPR-related content';
                  commentBody += `- ⚖️ **@${legalTeam}** - ${legalReason}\n`;
                }

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody
                });
                
              } catch (error) {
                console.error('Error adding reviewers:', error);
                throw new Error(`Failed to add reviewers: ${error.message}`);
              }
            } else {
              console.log('No new reviewers to add');
            }

      - name: Add docs-team reviewer for deploy PRs
        if: contains(github.event.pull_request.labels.*.name, 'Deploy')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          if gh api "repos/${REPO}/pulls/${PR}/requested_reviewers" \
            --jq '.teams[].slug' | grep -qx 'docs-team'; then
            echo "docs-team already requested"
            exit 0
          fi

          if gh pr edit "$PR" --repo "$REPO" --add-reviewer braze-inc/docs-team; then
            gh pr comment "$PR" --repo "$REPO" \
              --body $'🤖 **Automated Reviewer Assignment**: I have automatically added reviewers based on the following:\n\n- 📝 **@braze-inc/docs-team** - Deploy PR'
          else
            echo "Could not add docs-team via GH_TOKEN; posting manual request comment"
            gh pr comment "$PR" --repo "$REPO" \
              --body '🤖 **Automated Reviewer Assignment**: Could not auto-add **@braze-inc/docs-team** as a team reviewer (token permissions). Please add the team manually for this Deploy PR.'
          fi
