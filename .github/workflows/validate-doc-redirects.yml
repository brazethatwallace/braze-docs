# Ensures _docs/ URL changes (per Jekyll) have matching entries in broken_redirect_list.js
name: "Validate doc redirects"

on:
  pull_request:
    paths:
      - "_docs/**"
      - "_config.yml"
      - "_plugins/**"
      - "assets/js/broken_redirect_list.js"
      - "assets/redirects/bulk-redirects.json"
      - "scripts/generate_bulk_redirects.py"
      - "vercel.json"
      - "scripts/validate_doc_redirects.rb"
      - "scripts/jekyll_url_map_dump.rb"
      - "scripts/redirect_target_verify_helpers.rb"
      - "scripts/redirect_file_io.rb"
      - "scripts/apply_validurl_by_lhs_csv.rb"
      - "scripts/apply_validurl_rhs_from_csv.rb"
      - "scripts/normalize_broken_redirect_list.rb"
      - "scripts/collapse_validurls_chains.rb"
      - "scripts/heading_id_extractor.rb"
      - "scripts/jekyll_heading_id_dump.rb"
      - "scripts/doc_anchor_links.rb"
      - "spec/scripts/**"

permissions:
  contents: read

jobs:
  doc-redirects:
    name: "Redirect list vs Jekyll URLs"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Checkout PR head"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: "Fetch base branch for three-dot diff"
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: "Set up Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: "Run anchor/redirect helper specs"
        run: bundle exec rspec spec/scripts/

      - name: "Validate redirects"
        id: validate
        run: bundle exec ruby scripts/validate_doc_redirects.rb --base "origin/${{ github.base_ref }}" --skip-fetch --json redirect-report.json

      - name: "Sync redirect/anchor PR comment"
        if: always() && (steps.validate.outcome == 'success' || steps.validate.outcome == 'failure')
        uses: actions/github-script@v9
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- braze-docs-redirect-anchor-bot -->';
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            // Values below (old_url, source_file, link, etc.) come from the PR's own
            // file paths and link text, so a PR author fully controls their content.
            // Do NOT wrap untrusted values in markdown backtick spans: CommonMark/GFM
            // code-span matching pairs backtick runs of equal length wherever they next
            // occur in the block, not just adjacently, so any single backtick anywhere
            // in the value (however it's escaped) can still close the span early and let
            // the remaining markdown after it render live (spoofed links/headings). Use
            // an HTML <code> element with entity-escaping instead, which sidesteps
            // markdown code-span parsing entirely.
            // Collapse embedded line breaks to a single space FIRST. A value that
            // spans multiple physical lines (e.g. a markdown link whose destination was
            // captured across lines by doc_anchor_links.rb) can otherwise break out of
            // its enclosing list item / inline context entirely -- a blank line ends the
            // current list item regardless of an unclosed <code> tag, and a bare "text\n===" line
            // pair then forms a live Setext heading -- neither of which requires any of the
            // punctuation below. Reducing the value to a single line removes the
            // possibility of block-level (heading/list/blockquote/etc.) constructs forming
            // inside it at all.
            //
            // Then backslash-escape every ASCII punctuation character CommonMark treats as
            // potentially significant (link/image brackets, emphasis, code-span backticks,
            // headings, list markers, autolinks/raw HTML angle brackets, strikethrough,
            // Setext heading underlines). CommonMark renders "\X" as a literal "X" for
            // punctuation, so this is visually a no-op but prevents the value from being
            // parsed as markdown -- including when embedded inside a raw HTML <code> tag,
            // since CommonMark still runs ordinary inline parsing (links, backslash
            // escapes, code spans, etc.) on text between raw HTML tags; the tags don't
            // create an opaque/literal region on their own.
            const mdEscape = (s) => String(s)
              .replace(/\r\n|\r|\n/g, ' ')
              .replace(/([\\`*_{}\[\]()#+\-.!=:|<>~])/g, '\\$1');
            const code = (s) => `<code>${mdEscape(s)}</code>`;

            // Only used inside the ```js fenced block below, which is a different
            // injection surface (a lone line of 3+ backticks could close the fence
            // early): break up any run of backticks so a run of 3 can never form.
            const escForFence = (s) => String(s).replace(/`/g, '`' + '\u200b');

            const MAX_ITEMS_PER_SECTION = 30;
            const listItems = (items, render, moreRender) => {
              const shown = items.slice(0, MAX_ITEMS_PER_SECTION).map(render);
              if (items.length > MAX_ITEMS_PER_SECTION) {
                const remaining = items.length - MAX_ITEMS_PER_SECTION;
                shown.push(moreRender
                  ? moreRender(remaining)
                  : `- …and ${remaining} more (see the full report in the workflow run log)`);
              }
              return shown;
            };

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (process.env.VALIDATE_OUTCOME === 'success') {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                core.info(`Deleted resolved redirect/anchor comment ${existing.id}`);
              }
              return;
            }

            let report = null;
            try {
              report = JSON.parse(fs.readFileSync('redirect-report.json', 'utf8'));
            } catch (e) {
              core.warning('redirect-report.json missing or unreadable: ' + e.message);
            }

            if (!report) {
              // The script failed before it could write a report (e.g. worktree setup
              // failure) -- point at the Actions log instead of guessing at content.
              const body = [
                marker,
                '',
                '### Redirect / anchor check failed',
                '',
                'The check failed before it could produce a structured report. See the ' +
                  `[workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) log for details.`,
              ].join('\n');

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
              return;
            }

            const redirectRel = 'assets/js/broken_redirect_list.js';
            const sections = [];

            if (report.deleted_pages && report.deleted_pages.length) {
              sections.push([
                `#### Deleted pages (need a manual redirect target in \`${redirectRel}\`)`,
                '',
                ...listItems(report.deleted_pages, (r) => `- ${code(r.old_url)}`),
              ].join('\n'));
            }

            if (report.missing && report.missing.length) {
              sections.push([
                `#### Missing redirects (add to \`${redirectRel}\`)`,
                '',
                '```js',
                ...listItems(
                  report.missing,
                  (r) => `validurls['${escForFence(r.old_url)}'] = '${escForFence(r.expected_new)}';`,
                  (n) => `// …and ${n} more (see the full report in the workflow run log)`
                ),
                '```',
              ].join('\n'));
            }

            if (report.wrong_target && report.wrong_target.length) {
              sections.push([
                '#### Wrong redirect target',
                '',
                ...listItems(report.wrong_target, (r) => [
                  `- ${code(r.old_url)}`,
                  `  - expected: ${code(r.expected_new)}`,
                  `  - mapped: ${code(r.mapped_new)}`,
                ].join('\n')),
              ].join('\n'));
            }

            const renamed = (report.anchor_issues || []).filter((a) => a.category === 'heading_renamed');
            const newWrong = (report.anchor_issues || []).filter((a) => a.category === 'new_link_wrong_anchor');

            if (renamed.length) {
              sections.push([
                '#### Broken anchors (heading was renamed or removed -- update the link\'s anchor)',
                '',
                ...listItems(renamed, (a) => `- ${code(a.source_file)}: ${code(a.link)}`),
              ].join('\n'));
            }

            if (newWrong.length) {
              sections.push([
                '#### Broken anchors (new link points at a nonexistent anchor -- check for a typo or wrong target)',
                '',
                ...listItems(newWrong, (a) => `- ${code(a.source_file)}: ${code(a.link)}`),
              ].join('\n'));
            }

            if (report.anchor_warnings && report.anchor_warnings.length) {
              sections.push([
                '#### Non-blocking: links pointing at a target\'s first heading',
                '',
                'These behave identically to linking the page directly -- please confirm they\'re intentional (this does not block merge):',
                '',
                ...listItems(report.anchor_warnings, (w) => `- ${code(w.source_file)}: ${code(w.link)}`),
              ].join('\n'));
            }

            const MAX_BODY_LEN = 60000; // GitHub's issue-comment limit is 65536 chars
            let body = [
              marker,
              '',
              '### Redirect / anchor check failed',
              '',
              'This PR changes a doc URL or a heading anchor without a matching fix. Details below.',
              '',
              sections.join('\n\n'),
            ].join('\n');

            if (body.length > MAX_BODY_LEN) {
              body = body.slice(0, MAX_BODY_LEN) +
                `\n\n…(truncated for GitHub comment length -- see the [workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) log for the full report)`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated redirect/anchor comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              core.info('Created redirect/anchor comment');
            }

  redirect-list-js-syntax:
    name: "broken_redirect_list.js syntax"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout PR head"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: "Set up Node"
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: "Parse-check global redirect list"
        run: node --check assets/js/broken_redirect_list.js

  bulk-redirects-sync:
    name: "bulk-redirects.json in sync"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout PR head"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "Verify bulk redirects export"
        run: python3 scripts/generate_bulk_redirects.py --check
