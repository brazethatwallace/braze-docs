# Sitemap last-modified update (manual / develop PR path).
#
# Routine nightly updates run inside **Nightly Release Deploy** on the auto-deploy
# snapshot branch so deploy PRs include fresh _data/sitemap_*.json without a second PR.
#
# Use this workflow when you need an ad-hoc sitemap refresh on develop (for example
# after a failed deploy sitemap step or between deploys). It opens a PR to develop
# because branch protection blocks direct pushes to develop.
#
name: "Nightly sitemap last-modified update"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# Prevent overlapping runs from racing.
concurrency:
  group: nightly-sitemap-update
  cancel-in-progress: false

jobs:
  update-sitemaps:
    name: "Update sitemap last-modified dates"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout develop"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          fetch-depth: 0

      - name: "Set up Ruby"
        uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "3.3"

      - name: "Update sitemaps"
        run: ruby scripts/generate_sitemap_lastmodified.rb all

      - name: "Create PR with sitemap updates"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain _data/sitemap_*.json)" ]; then
            echo "No sitemap changes to commit."
            exit 0
          fi

          BRANCH="chore/nightly-sitemap-update-$(date -u +'%Y-%m-%d')"
          PR_TITLE="chore: nightly sitemap last-modified update ($(date -u +'%Y-%m-%d'))"
          PR_BODY="Automated update of \`_data/sitemap_*.json\` last-modified dates.

          This PR was created by the **Nightly sitemap last-modified update** workflow (manual run).

          Routine nightly updates are applied on the **Nightly Release Deploy** snapshot branch. Use this PR path when you need sitemap JSON on \`develop\` between deploys or after a failed sitemap step in deploy.

          > **On-call:** merge into \`develop\` when ready, then sync \`main\` → \`develop\` after deploy merges if needed so both branches stay aligned."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add _data/sitemap_*.json
          git commit -m "chore: nightly sitemap last-modified update"

          # If the remote branch already exists (same-day re-run), force-push to update it
          # so the existing PR picks up the latest sitemap commit.
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            git push --force-with-lease origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi

          # Reuse an existing open PR for today if one exists (e.g. manual re-run).
          EXISTING=$(gh pr list --base develop --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing PR #$EXISTING with latest sitemap commit."
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --label "nightly-sitemap"
          fi

      - name: "Open issue on failure"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --state open --search "Nightly sitemap update failed in:title" --limit 1 --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open, skipping duplicate."
          else
            ISSUE_BODY=$(printf "The nightly sitemap last-modified update failed. Check the run log for details.\n\n**Run:** %s\n\nCommon causes: branch creation failure, PR creation failure, or Ruby script error." "$RUN_URL")
            gh issue create \
              --title "Nightly sitemap update failed ($(date -u +'%Y-%m-%d'))" \
              --body "$ISSUE_BODY"
          fi
