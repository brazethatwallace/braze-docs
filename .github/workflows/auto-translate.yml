# Translates English docs into all supported languages using Claude.
#
# Trigger: workflow_dispatch only (push-to-main trigger temporarily disabled
# during catch-up; re-enable after cleanup — restore the `push` block below).
#
# When enabled, push runs after deploy merges to main for changed _docs/ and
# _includes/ markdown files.
#
# Flow:
#   1. Identify _docs/ and _includes/ markdown files changed in the push
#   2. Translate each file into 6 languages via Claude API
#   3. Build each language with Jekyll to verify translations
#   4. If a build fails, send errors back to Claude for auto-fix (up to 3 attempts)
#   5. Clean up orphaned translation files (translations with no English source)
#   6. Open a PR targeting develop with the translations
name: Auto-translate

on:
  # push:
  #   branches: [main]
  #   paths: ['_docs/**', '_includes/**']
  workflow_dispatch:
    inputs:
      files:
        description: >
          Space-separated _docs/ or _includes/ paths to translate
          (leave empty unless using since_commit or push-based detection).
          When set, the workflow skips global orphan cleanup even if
          skip_orphan_cleanup is false — partial batches must not delete
          every locale mirror whose English path moved in IA (PR #13327).
        required: false
        type: string
      since_commit:
        description: >
          Optional commit SHA: diff this commit..current ref for all changed
          English .md under _docs/ and _includes/ (catch-up; ignores files input)
        required: false
        type: string
      skip_orphan_cleanup:
        description: >
          If true, skip clean_orphaned_translations (use for intermediate
          catch-up batches; run false on final batch)
        required: false
        type: string
        default: "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-translate:
    runs-on: ubuntu-latest
    # Hard wall-clock ceiling so a stalled Anthropic stream can't hog a
    # runner indefinitely (run 24906077736 spent 87+ minutes stuck on
    # `Translate changed files` before manual cancellation). Healthy
    # wave-4 runs finished in 9-35 min on batches of ~40 files × 6
    # locales; large catch-up diffs (e.g. run 24911225298: 126 file×locale
    # tasks) can exceed the old 75-minute translate step. 210 / 165 leaves
    # room for QC + multi-locale Jekyll verify + PR while still capping
    # runaway jobs.
    timeout-minutes: 210
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # ------------------------------------------------------------------
      # Detect which English docs changed
      # ------------------------------------------------------------------
      - name: Identify changed English files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ -z "${{ inputs.since_commit }}" ] && \
             [ -z "${{ inputs.files }}" ]; then
            echo "workflow_dispatch requires since_commit (catch-up diff) and/or files (explicit paths)."
            exit 1
          fi
          if [ -n "${{ inputs.since_commit }}" ]; then
            echo "Using since_commit=${{ inputs.since_commit }}..${{ github.sha }}"
            git diff --find-renames --name-only --diff-filter=ACMR \
              "${{ inputs.since_commit }}" "${{ github.sha }}" \
              -- '_docs/' '_includes/' > changed_files.txt
          elif [ -n "${{ inputs.files }}" ]; then
            echo "${{ inputs.files }}" | tr ' ' '\n' > changed_files.txt
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMR \
              ${{ github.event.before }} ${{ github.sha }} \
              -- '_docs/' '_includes/' > changed_files.txt
          else
            git diff --name-only --diff-filter=ACMR \
              HEAD~1 HEAD \
              -- '_docs/' '_includes/' > changed_files.txt
          fi

          # Keep only markdown files
          grep '\.md$' changed_files.txt > filtered.txt 2>/dev/null || true
          mv filtered.txt changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          count=$(wc -l < changed_files.txt | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Skip if no changes
        if: steps.changes.outputs.count == '0'
        run: |
          echo "No English markdown changes detected — nothing to translate."
          exit 0

      # ------------------------------------------------------------------
      # Translate
      # ------------------------------------------------------------------
      - name: Set up Python
        if: steps.changes.outputs.count != '0'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.changes.outputs.count != '0'
        run: pip install anthropic pyyaml

      - name: Translate changed files
        id: translate
        if: steps.changes.outputs.count != '0'
        continue-on-error: true
        # Step-level timeout sits inside the job ceiling above. A stalled
        # Anthropic stream is bounded per-request by the Anthropic client's
        # HTTP timeout (`TRANSLATION_HTTP_TIMEOUT`, default 180s) + 3 retries
        # in `call_claude`, so a single task can't burn more than ~9 min.
        # Large batches still need wall clock for many sequential tasks;
        # 165 min leaves ~45 min for QC, Ruby/Jekyll verify, and PR steps.
        timeout-minutes: 165
        run: python scripts/auto_translate.py translate --changed-files changed_files.txt

      # ------------------------------------------------------------------
      # Quality checks
      # ------------------------------------------------------------------
      - name: Run translation QC checks
        id: qc
        if: steps.changes.outputs.count != '0'
        continue-on-error: true
        run: python scripts/auto_translate.py qc

      # ------------------------------------------------------------------
      # Build verification + auto-fix loop
      # ------------------------------------------------------------------
      - name: Set up Ruby
        if: steps.changes.outputs.count != '0'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Clean up orphaned translations
        # Never run after an explicit `files:` batch — cleanup compares every
        # `_lang` path to current `_docs`/`_includes` and would mass-delete
        # pre-IA mirrors still on disk until catch-up finishes (PR #13327).
        if: ${{ steps.changes.outputs.count != '0' && (github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.skip_orphan_cleanup != 'true' && inputs.files == '')) }}
        run: python scripts/clean_orphaned_translations.py

      # Alias check runs after orphan cleanup so stale duplicates from the
      # IA restructure don't fail the job. Skipped during catch-up batches
      # (skip_orphan_cleanup=true) or explicit `files:` batches (same guard as
      # orphan cleanup — PR #13327).
      - name: Check for duplicate YAML aliases
        id: aliases
        if: ${{ steps.changes.outputs.count != '0' && (github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.skip_orphan_cleanup != 'true' && inputs.files == '')) }}
        continue-on-error: true
        run: python scripts/auto_translate.py check-aliases

      - name: Verify builds and fix errors
        id: verify
        if: steps.changes.outputs.count != '0'
        continue-on-error: true
        run: python scripts/auto_translate.py verify --max-attempts 3

      # ------------------------------------------------------------------
      # Open PR targeting develop
      # ------------------------------------------------------------------
      - name: Generate PR summary
        if: steps.changes.outputs.count != '0'
        run: python scripts/auto_translate.py summary

      - name: Create pull request
        id: create-pr
        if: steps.changes.outputs.count != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-translate/${{ github.run_id }}
          base: develop
          title: "Auto-translations — ${{ github.event.head_commit.message || 'manual run' }}"
          body-path: translation_pr_body.md
          labels: |
            auto-translation
            In Review
          commit-message: "chore: auto-translate changed English docs"
          delete-branch: true
          add-paths: |
            _lang/

      # Requires GitHub Copilot code review on the repo/org (see GitHub Docs).
      # Prefers the `gh pr edit --add-reviewer @copilot` shortcut (gh >= 2.88.0,
      # released 2026-03-11). Falls back to the REST API bot-login workaround
      # if the shortcut isn't available or fails for any reason. Non-blocking:
      # a missing Copilot review should never stop translation PRs from merging.
      - name: Request Copilot review
        if: ${{ steps.changes.outputs.count != '0' && steps.create-pr.outputs.pull-request-number }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          if gh pr edit "$PR_NUMBER" --repo "$REPO" --add-reviewer @copilot; then
            echo "Requested Copilot review via gh CLI shortcut."
            exit 0
          fi
          echo "gh CLI shortcut failed; falling back to REST API bot login..."
          if gh api --method POST \
            "/repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer[bot]"; then
            echo "Requested Copilot review via REST API fallback."
            exit 0
          fi
          echo "::warning::Could not request Copilot review. PR $PR_NUMBER is open; add reviewer manually if needed."

      - name: Report failures
        if: steps.translate.outcome == 'failure' || steps.qc.outcome == 'failure' || steps.aliases.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          echo "::warning::One or more translation steps had failures — check the PR summary for details."
          echo "  Translate: ${{ steps.translate.outcome }}"
          echo "  QC:        ${{ steps.qc.outcome }}"
          echo "  Aliases:   ${{ steps.aliases.outcome }}"
          echo "  Verify:    ${{ steps.verify.outcome }}"
          exit 1
