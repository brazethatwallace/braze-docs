# Translates English docs into all supported languages using Claude.
#
# Trigger: workflow_dispatch only (push-to-main trigger temporarily disabled
# during catch-up; re-enable after cleanup — restore the `push` block below).
#
# When enabled, push runs after deploy merges to main for changed _docs/ and
# _includes/ markdown files.
#
# Flow:
#   1. Identify _docs/ and _includes/ markdown files changed in the push
#   2. Translate each file into 6 languages via Claude API
#   3. Build each language with Jekyll to verify translations
#   4. If a build fails, send errors back to Claude for auto-fix (up to 3 attempts)
#   5. Clean up orphaned translation files (translations with no English source)
#   6. Open a PR targeting develop with the translations
name: Auto-translate

on:
  # push:
  #   branches: [main]
  #   paths: ['_docs/**', '_includes/**']
  workflow_dispatch:
    inputs:
      files:
        description: >
          Space-separated _docs/ or _includes/ paths to translate
          (leave empty unless using since_commit or push-based detection)
        required: false
        type: string
      since_commit:
        description: >
          Optional commit SHA: diff this commit..current ref for all changed
          English .md under _docs/ and _includes/ (catch-up; ignores files input)
        required: false
        type: string
      skip_orphan_cleanup:
        description: >
          If true, skip clean_orphaned_translations (use for intermediate
          catch-up batches; run false on final batch)
        required: false
        type: string
        default: "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-translate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # ------------------------------------------------------------------
      # Detect which English docs changed
      # ------------------------------------------------------------------
      - name: Identify changed English files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ -z "${{ inputs.since_commit }}" ] && \
             [ -z "${{ inputs.files }}" ]; then
            echo "workflow_dispatch requires since_commit (catch-up diff) and/or files (explicit paths)."
            exit 1
          fi
          if [ -n "${{ inputs.since_commit }}" ]; then
            echo "Using since_commit=${{ inputs.since_commit }}..${{ github.sha }}"
            git diff --find-renames --name-only --diff-filter=ACMR \
              "${{ inputs.since_commit }}" "${{ github.sha }}" \
              -- '_docs/' '_includes/' > changed_files.txt
          elif [ -n "${{ inputs.files }}" ]; then
            echo "${{ inputs.files }}" | tr ' ' '\n' > changed_files.txt
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMR \
              ${{ github.event.before }} ${{ github.sha }} \
              -- '_docs/' '_includes/' > changed_files.txt
          else
            git diff --name-only --diff-filter=ACMR \
              HEAD~1 HEAD \
              -- '_docs/' '_includes/' > changed_files.txt
          fi

          # Keep only markdown files
          grep '\.md$' changed_files.txt > filtered.txt 2>/dev/null || true
          mv filtered.txt changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          count=$(wc -l < changed_files.txt | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Skip if no changes
        if: steps.changes.outputs.count == '0'
        run: |
          echo "No English markdown changes detected — nothing to translate."
          exit 0

      # ------------------------------------------------------------------
      # Translate
      # ------------------------------------------------------------------
      - name: Set up Python
        if: steps.changes.outputs.count != '0'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.changes.outputs.count != '0'
        run: pip install anthropic pyyaml

      - name: Translate changed files
        id: translate
        if: steps.changes.outputs.count != '0'
        continue-on-error: true
        run: python scripts/auto_translate.py translate --changed-files changed_files.txt

      # ------------------------------------------------------------------
      # Quality checks
      # ------------------------------------------------------------------
      - name: Run translation QC checks
        id: qc
        if: steps.changes.outputs.count != '0'
        continue-on-error: true
        run: python scripts/auto_translate.py qc

      # ------------------------------------------------------------------
      # Build verification + auto-fix loop
      # ------------------------------------------------------------------
      - name: Set up Ruby
        if: steps.changes.outputs.count != '0'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Clean up orphaned translations
        if: ${{ steps.changes.outputs.count != '0' && (github.event_name != 'workflow_dispatch' || inputs.skip_orphan_cleanup != 'true') }}
        run: python scripts/clean_orphaned_translations.py

      - name: Verify builds and fix errors
        id: verify
        if: steps.changes.outputs.count != '0'
        continue-on-error: true
        run: python scripts/auto_translate.py verify --max-attempts 3

      # ------------------------------------------------------------------
      # Open PR targeting develop
      # ------------------------------------------------------------------
      - name: Generate PR summary
        if: steps.changes.outputs.count != '0'
        run: python scripts/auto_translate.py summary

      - name: Create pull request
        id: create-pr
        if: steps.changes.outputs.count != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-translate/${{ github.run_id }}
          base: develop
          title: "Auto-translations — ${{ github.event.head_commit.message || 'manual run' }}"
          body-path: translation_pr_body.md
          labels: |
            auto-translation
            In Review
          commit-message: "chore: auto-translate changed English docs"
          delete-branch: true
          add-paths: |
            _lang/

      - name: Report failures
        if: steps.translate.outcome == 'failure' || steps.qc.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          echo "::warning::One or more translation steps had failures — check the PR summary for details."
          echo "  Translate: ${{ steps.translate.outcome }}"
          echo "  QC:        ${{ steps.qc.outcome }}"
          echo "  Verify:    ${{ steps.verify.outcome }}"
          exit 1
