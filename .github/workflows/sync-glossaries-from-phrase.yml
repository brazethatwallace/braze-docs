# Sync translation glossaries from Phrase TMS term bases.
#
# Phrase term bases are the source of truth for scripts/glossaries/*.json.
# Downloads each locale's term base, writes JSON glossaries, and opens a PR
# when entries change.
name: Sync glossaries from Phrase

on:
  schedule:
    - cron: '0 5 * * 0'   # Every Sunday at 05:00 UTC (before drift audit)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout braze-docs
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements-glossaries.txt

      - name: Sync glossaries from Phrase
        id: sync
        env:
          PHRASE_TMS_TOKEN: ${{ secrets.PHRASE_TMS_TOKEN }}
          PHRASE_PLATFORM_BASE_URL: https://eu.phrase.com
          PHRASE_TMS_BASE_URL: https://cloud.memsource.com
        run: python scripts/sync_glossaries_from_phrase.py --report phrase_sync_report.md

      - name: Ensure labels exist
        if: >-
          steps.sync.outputs.total_changes != '' &&
          steps.sync.outputs.total_changes != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "glossary-sync" --description "Phrase glossary sync" --color "1D76DB" --force
          gh label create "status: done" --description "Work is done and ready to be merged." --color "0E8A16" --force

      - name: Create pull request
        if: >-
          steps.sync.outputs.total_changes != '' &&
          steps.sync.outputs.total_changes != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: phrase-glossary-sync/${{ github.run_id }}
          base: develop
          title: "Glossary sync: update from Phrase term bases"
          body-path: phrase_sync_report.md
          labels: |
            glossary-sync
            status: done
          commit-message: "chore: sync glossaries from Phrase term bases"
          delete-branch: true
          add-paths: |
            scripts/glossaries/
