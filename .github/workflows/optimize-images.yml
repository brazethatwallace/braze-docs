# Optimizes only the images that are added or modified in a pull request.
name: "Optimize Images"

on:
  pull_request:
    # Run this workflow only if image files under assets/img/ are changed.
    paths:
      - 'assets/img/**/*.png'
      - 'assets/img/**/*.jpg'
      - 'assets/img/**/*.jpeg'

jobs:
  optimize:
    runs-on: ubuntu-latest
    # Avoid two runs optimizing the same PR branch at once (duplicate commits / push races).
    concurrency:
      group: optimize-images-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      # Checks out the PR branch with history so diffs can be detected.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Installs CLI tools for image optimization.
      - run: sudo apt-get update && sudo apt-get install -y pngquant jpegoptim

      # Ensures the base branch ref is available for the diff.
      - run: git fetch origin ${{ github.base_ref }} --no-tags

      # Finds only added/modified PNG or JPG files in the PR and optimizes them in place.
      - run: |
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD | grep -E '^assets/img/.*\.(png|jpg|jpeg)$' || true)
          if [[ -n "$files" ]]; then
            echo "$files" | while IFS= read -r f; do
              case "$f" in
                *.png)  pngquant --skip-if-larger --ext .png --force 80 "$f" || true ;;
                *.jpg|*.jpeg) jpegoptim --strip-all --max=80 "$f" || true ;;
              esac
            done
          else
            echo "No image files to optimize."
          fi
          exit 0

      # Commit and push optimized images. We do this with explicit git commands
      # instead of git-auto-commit-action to avoid the action's internal
      # fetch/checkout overwriting our modified image files (which causes
      # "Your local changes would be overwritten by checkout" on force-pushed branches).
      - name: Commit and push optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img/
          if git diff --staged --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "optimize png, jpg, and jpeg files"
            set -e
            head_ref="${{ github.head_ref }}"
            # Remote may advance between checkout and push (other commits, another workflow).
            # Rebase our commit on top of origin and retry with backoff to avoid non-fast-forward rejects.
            attempt=0
            max_attempts=6
            while [ "$attempt" -lt "$max_attempts" ]; do
              attempt=$((attempt + 1))
              git fetch origin "$head_ref" --no-tags
              if ! git rebase "origin/$head_ref"; then
                echo "Rebase failed; aborting rebase."
                git rebase --abort || true
                exit 1
              fi
              if git push "origin" "HEAD:$head_ref"; then
                echo "Push succeeded on attempt $attempt."
                exit 0
              fi
              echo "Push failed (attempt $attempt/$max_attempts)."
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Sleeping before retry..."
                sleep "$((2 ** attempt))"
              fi
            done
            echo "Push failed after $max_attempts attempts."
            exit 1
          fi
