# Lighthouse CI — weekly performance monitoring
#
# Runs Lighthouse against a representative sample of production pages on a
# weekly schedule (Monday mornings PT) and uploads HTML + JSON reports as
# GitHub Actions artifacts. Results are also printed to the run log.
#
# Thresholds (from the Braze Docs Performance Standards doc):
#   LCP  ≤ 2,500ms  → CI error
#   CLS  ≤ 0.1      → CI error
#   TBT  ≤ 300ms    → warning (heavier pages expected to exceed until JS audit lands)
#   Perf score ≥ 70 → warning
#
# To view reports: Actions → this run → Artifacts → lhci-reports → open report.html
#
# Manual trigger: Actions → "Lighthouse CI" → Run workflow
#
# To add or change sampled pages, edit scripts/generate-lhci-urls.js.
# To change thresholds, edit lighthouserc.js.

name: Lighthouse CI

on:
  schedule:
    - cron: '0 15 * * 1' # 8am PT / 11am ET every Monday
  workflow_dispatch:
    inputs:
      urls_override:
        description: 'Optional: newline-separated URLs to test instead of the generated list'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: lighthouse-ci
  cancel-in-progress: true # cancel stale runs if manually triggered twice

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Generate URL list
        id: urls
        env:
          URLS_OVERRIDE: ${{ github.event.inputs.urls_override }}
        run: |
          if [ -n "$URLS_OVERRIDE" ]; then
            printf '%s\n' "$URLS_OVERRIDE" > lhci-urls.txt
            echo "Using manually provided URLs."
          else
            node scripts/generate-lhci-urls.js --output lhci-urls.txt
          fi
          echo "--- URLs to test ---"
          cat lhci-urls.txt

      - name: Run Lighthouse CI
        run: npx --no-install lhci autorun --config=lighthouserc.js
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

      - name: Upload LHCI reports
        if: always() # upload even if assertions fail so we can see what happened
        uses: actions/upload-artifact@v7
        with:
          name: lhci-reports-${{ github.run_number }}
          path: lhci-reports/
          retention-days: 90

      - name: Print summary
        if: always()
        run: |
          echo "## Lighthouse CI results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Target | Notes |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| LCP | ≤ 2,500ms | Error if exceeded |" >> $GITHUB_STEP_SUMMARY
          echo "| CLS | ≤ 0.1 | Error if exceeded |" >> $GITHUB_STEP_SUMMARY
          echo "| TBT | ≤ 300ms | Warning only |" >> $GITHUB_STEP_SUMMARY
          echo "| Perf score | ≥ 70 | Warning only |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the \`lhci-reports\` artifact to view full HTML reports." >> $GITHUB_STEP_SUMMARY
          echo "URL list was generated by \`scripts/generate-lhci-urls.js\`." >> $GITHUB_STEP_SUMMARY
