name: Vercel Preview (bot)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: write
  deployments: write
  pull-requests: write

concurrency:
  group: vercel-preview-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STATUS_CONTEXT: "Vercel – braze-docs-en"
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy EN preview and publish Vercel status
        id: deploy
        run: |
          set -uo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID."
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              --method POST \
              -f state="error" \
              -f context="${STATUS_CONTEXT}" \
              -f description="Missing Vercel credentials in repo secrets." >/dev/null || true
            echo "deploy_state=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Create a GitHub Deployment so the PR keeps the "View deployment" UX.
          # required_contexts must be an explicit empty array, otherwise GitHub
          # rejects creation with "409 Conflict: Commit status checks failed"
          # whenever the commit still has pending/failing checks.
          printf '{"ref":"%s","environment":"Preview – braze-docs-en (docs bot)","auto_merge":false,"transient_environment":true,"production_environment":false,"required_contexts":[]}' \
            "${HEAD_SHA}" > "${RUNNER_TEMP}/deployment.json"
          deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments" \
            --input "${RUNNER_TEMP}/deployment.json" --jq '.id' || true)"

          # The runner invokes this step as `bash -e`, so disable errexit
          # around the deploy call to capture its exit code and output even on
          # failure. VERCEL_ORG_ID and VERCEL_PROJECT_ID env vars scope the
          # deploy, so no --scope flag is needed.
          set +e
          # --archive=tgz uploads a single tarball; the repo has >15000 files,
          # which exceeds Vercel's per-deploy file-count limit otherwise.
          deploy_output="$(vercel deploy \
            --token "${VERCEL_TOKEN}" \
            --archive=tgz \
            --yes \
            --meta "githubCommitSha=${HEAD_SHA}" \
            --meta "githubCommitRef=${HEAD_REF}" \
            --meta "githubPr=${PR_NUMBER}" 2>&1)"
          deploy_exit_code=$?
          set -e

          echo "${deploy_output}"

          preview_url="$(printf '%s' "${deploy_output}" | python3 -c 'import re,sys; m=re.findall(r"https://[^\s]+\.vercel\.app", sys.stdin.read()); print(m[-1] if m else "")')"

          if [[ "${deploy_exit_code}" -eq 0 && -n "${preview_url}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              --method POST \
              -f state="success" \
              -f context="${STATUS_CONTEXT}" \
              -f target_url="${preview_url}" \
              -f description="Preview deployed successfully." >/dev/null
            echo "deploy_state=success" >> "$GITHUB_OUTPUT"
            echo "preview_en_url=${preview_url}" >> "$GITHUB_OUTPUT"

            if [[ -n "${deployment_id}" && "${deployment_id}" != "null" ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                --method POST \
                -f state="success" \
                -f environment_url="${preview_url}" \
                -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                -f description="Vercel EN preview is available." >/dev/null || true
            fi

            {
              echo "### Vercel preview status (docs bot)"
              echo
              echo "EN preview: ${preview_url}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            fallback_url="${preview_url:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              --method POST \
              -f state="failure" \
              -f context="${STATUS_CONTEXT}" \
              -f target_url="${fallback_url}" \
              -f description="Preview deployment failed." >/dev/null
            echo "deploy_state=failure" >> "$GITHUB_OUTPUT"

            if [[ -n "${deployment_id}" && "${deployment_id}" != "null" ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                --method POST \
                -f state="failure" \
                -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                -f description="Vercel EN preview failed." >/dev/null || true
            fi

            {
              echo "### Vercel preview status (docs bot)"
              echo
              echo "EN preview deploy failed — see workflow logs."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

      - name: Comment preview URL on pull request
        if: always()
        run: |
          set -uo pipefail

          marker="<!-- vercel-preview-docs-bot -->"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "${{ steps.deploy.outputs.deploy_state }}" == "success" && -n "${{ steps.deploy.outputs.preview_en_url }}" ]]; then
            body="$(printf '%s\n\n%s\n\n%s' \
              "${marker} ✅ Docs bot Vercel preview deployed successfully." \
              "EN preview: ${{ steps.deploy.outputs.preview_en_url }}" \
              "Trust this check for preview status. Other locale Vercel checks are handled by the native Vercel integration.")"
          else
            body="$(printf '%s\n\n%s' \
              "${marker} ❌ Docs bot Vercel preview deploy failed." \
              "Open this workflow run for details: ${run_url}")"
          fi

          existing_comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
            | python3 -c 'import sys; ids=[l.strip() for l in sys.stdin if l.strip()]; print(ids[-1] if ids else "")')"

          if [[ -n "${existing_comment_id}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment_id}" \
              --method PATCH \
              -f body="${body}" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --method POST \
              -f body="${body}" >/dev/null
          fi
