# Triggers a Cursor Cloud Agent to investigate a Jira feedback ticket and propose a fix (draft PR).
# Caller dispatches `repository_dispatch` with event type `jira-feedback-ticket` and a client_payload
# containing ticket fields. See Cloud Agents API: https://cursor.com/docs/cloud-agent/api/endpoints

name: Jira feedback — Cursor cloud agent

on:
  repository_dispatch:
    types:
      - jira-feedback-ticket

jobs:
  start-cursor-cloud-agent:
    name: Start Cursor cloud agent
    runs-on: ubuntu-latest
    steps:
      - name: Log Jira ticket context
        env:
          TICKET_ID: ${{ github.event.client_payload.ticket_id }}
          SUMMARY: ${{ github.event.client_payload.summary }}
        run: |
          set -euo pipefail
          echo "Jira ticket ID: ${TICKET_ID}"
          echo "Summary: ${SUMMARY}"

      - name: Validate payload and secrets
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TICKET_ID: ${{ github.event.client_payload.ticket_id }}
        run: |
          set -euo pipefail
          if [ -z "${TICKET_ID}" ]; then
            echo "::error::client_payload.ticket_id is required"
            exit 1
          fi
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "::error::CURSOR_API_KEY repository secret is not set or not available to this workflow"
            exit 1
          fi
          if [ -z "${GH_PAT}" ]; then
            echo "::error::GH_PAT repository secret is not set or not available to this workflow"
            exit 1
          fi

      - name: Create Cursor Cloud Agent (POST /v1/agents)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TICKET_ID: ${{ github.event.client_payload.ticket_id }}
          SUMMARY: ${{ github.event.client_payload.summary }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          REPORTER: ${{ github.event.client_payload.reporter }}
          JIRA_URL: ${{ github.event.client_payload.url }}
        run: |
          set -euo pipefail

          # Request body per https://cursor.com/docs/cloud-agent/api/endpoints
          # Auth: Basic with API key as username, empty password (same as curl -u 'KEY:')

          BODY=$(jq -n \
            --arg ticket_id "${TICKET_ID}" \
            --arg summary "${SUMMARY:-}" \
            --arg description "${DESCRIPTION:-}" \
            --arg reporter "${REPORTER:-}" \
            --arg jira_url "${JIRA_URL:-}" \
            --arg repo_url "${REPO_URL}" \
            --arg gh_pat "${GH_PAT}" \
            '{
              prompt: {
                text: (
                  "You are handling a Jira feedback ticket routed from GitHub Actions.\n\n" +
                  "Follow the repository agent instructions in `.cursor/agents/feedback-handler.md` as the authoritative playbook. Read that file early and align your work with it.\n\n" +
                  "## Jira ticket\n" +
                  "- **ID:** " + $ticket_id + "\n" +
                  "- **Summary:** " + $summary + "\n" +
                  "- **Description:**\n" + $description + "\n\n" +
                  "- **Reporter:** " + $reporter + "\n" +
                  "- **URL:** " + $jira_url + "\n\n" +
                  "## Repository requirements\n" +
                  "- Base branch: `develop` (this agent run is started from that ref).\n" +
                  "- Open a **draft** pull request only. If you create the PR with GitHub CLI, use `gh pr create --draft`. Do not mark the PR ready for review.\n" +
                  "- Use the `GH_PAT` environment variable for git and GitHub authentication when pushing branches or opening PRs. Configure remotes or credential helpers as needed. Never print or commit this secret.\n"
                )
              },
              repos: [
                {
                  url: $repo_url,
                  startingRef: "develop"
                }
              ],
              branchName: ("jira-" + $ticket_id),
              autoCreatePR: true,
              skipReviewerRequest: true,
              envVars: {
                GH_PAT: $gh_pat
              }
            }')

          HTTP_CODE=$(curl -sS -o /tmp/cursor-agent-response.json -w '%{http_code}' \
            --request POST \
            --url 'https://api.cursor.com/v1/agents' \
            -u "${CURSOR_API_KEY}:" \
            --header 'Content-Type: application/json' \
            --data "${BODY}")

          echo "Cursor API HTTP status: ${HTTP_CODE}"
          cat /tmp/cursor-agent-response.json
          echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Cursor Cloud Agent API request failed (HTTP ${HTTP_CODE})"
            exit 1
          fi

          echo "Cursor Cloud Agent started successfully."
