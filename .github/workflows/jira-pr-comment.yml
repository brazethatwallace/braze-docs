# Posts a "draft PR ready" comment on the linked Jira ticket when a PR is opened
# from a `jira-<TICKET_ID>` branch (Cursor doc feedback automation).
#
# Repository secrets:
# - `JIRA_USER_EMAIL` — Atlassian account email for Jira REST Basic auth
# - `JIRA_API_TOKEN` — Atlassian API token (permission to add comments on issues)

name: Jira — PR ready comment

on:
  pull_request:
    types:
      - opened

jobs:
  comment-on-jira:
    name: Comment on Jira ticket
    if: startsWith(github.event.pull_request.head.ref, 'jira-')
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Extract Jira ticket ID from branch
        id: ticket
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          TICKET_ID="${BRANCH#jira-}"
          if [ -z "${TICKET_ID}" ] || [ "${TICKET_ID}" = "${BRANCH}" ]; then
            echo "::error::Could not extract ticket ID from branch: ${BRANCH}"
            exit 1
          fi
          echo "ticket_id=${TICKET_ID}" >> "${GITHUB_OUTPUT}"
          echo "Jira ticket ID: ${TICKET_ID}"

      - name: Post PR ready comment on Jira
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET_ID: ${{ steps.ticket.outputs.ticket_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${JIRA_USER_EMAIL}" ] || [ -z "${JIRA_API_TOKEN}" ]; then
            echo "::warning::JIRA_USER_EMAIL or JIRA_API_TOKEN is not set; skipping Jira comment."
            exit 0
          fi

          AUTH_B64=$(printf '%s:%s' "${JIRA_USER_EMAIL}" "${JIRA_API_TOKEN}" | base64 -w0)

          # Fetch assignee so we can @-mention them in the comment.
          ASSIGNEE_ACCOUNT_ID=""
          ASSIGNEE_DISPLAY_NAME=""
          set +e
          ISSUE_HTTP=$(curl -sS -o /tmp/jira-issue-response.json -w '%{http_code}' \
            --request GET \
            --url "https://braze.atlassian.net/rest/api/3/issue/${TICKET_ID}?fields=assignee" \
            --header "Authorization: Basic ${AUTH_B64}" \
            --header 'Accept: application/json')
          ISSUE_CURL_EXIT=$?
          set -e

          if [ "${ISSUE_CURL_EXIT}" -eq 0 ] && [ "${ISSUE_HTTP}" -ge 200 ] && [ "${ISSUE_HTTP}" -lt 300 ]; then
            ASSIGNEE_ACCOUNT_ID=$(jq -r '.fields.assignee.accountId // empty' /tmp/jira-issue-response.json)
            ASSIGNEE_DISPLAY_NAME=$(jq -r '.fields.assignee.displayName // empty' /tmp/jira-issue-response.json)
          else
            echo "::warning::Could not fetch Jira assignee (HTTP ${ISSUE_HTTP:-?}); commenting without mention."
          fi

          if [ -n "${ASSIGNEE_ACCOUNT_ID}" ]; then
            COMMENT_JSON=$(jq -n \
              --arg pr_url "${PR_URL}" \
              --arg account_id "${ASSIGNEE_ACCOUNT_ID}" \
              --arg mention_text "@${ASSIGNEE_DISPLAY_NAME}" \
              '{
                body: {
                  version: 1,
                  type: "doc",
                  content: [
                    {
                      type: "paragraph",
                      content: [
                        { type: "text", text: "🤖 " },
                        {
                          type: "mention",
                          attrs: {
                            id: $account_id,
                            text: $mention_text
                          }
                        },
                        {
                          type: "text",
                          text: " — A draft PR is ready for your review: "
                        },
                        {
                          type: "text",
                          text: $pr_url,
                          marks: [
                            {
                              type: "link",
                              attrs: {
                                href: $pr_url
                              }
                            }
                          ]
                        }
                      ]
                    },
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: "Please review the proposed changes and merge or request edits as needed."
                        }
                      ]
                    }
                  ]
                }
              }')
          else
            COMMENT_JSON=$(jq -n \
              --arg pr_url "${PR_URL}" \
              '{
                body: {
                  version: 1,
                  type: "doc",
                  content: [
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: "🤖 A draft PR is ready for your review: "
                        },
                        {
                          type: "text",
                          text: $pr_url,
                          marks: [
                            {
                              type: "link",
                              attrs: {
                                href: $pr_url
                              }
                            }
                          ]
                        }
                      ]
                    },
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: "Please review the proposed changes and merge or request edits as needed."
                        }
                      ]
                    }
                  ]
                }
              }')
          fi

          set +e
          HTTP_CODE=$(curl -sS -o /tmp/jira-pr-comment-response.json -w '%{http_code}' \
            --request POST \
            --url "https://braze.atlassian.net/rest/api/3/issue/${TICKET_ID}/comment" \
            --header "Authorization: Basic ${AUTH_B64}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data "${COMMENT_JSON}")
          CURL_EXIT=$?
          set -e

          echo "Jira comment API HTTP status: ${HTTP_CODE} (curl exit ${CURL_EXIT})"
          if [ -f /tmp/jira-pr-comment-response.json ]; then
            cat /tmp/jira-pr-comment-response.json
            echo
          fi

          if [ "${CURL_EXIT}" -ne 0 ] || [ "${HTTP_CODE:-0}" -lt 200 ] || [ "${HTTP_CODE:-0}" -ge 300 ]; then
            echo "::warning::Jira PR-ready comment failed or was skipped. Workflow continues."
          fi
