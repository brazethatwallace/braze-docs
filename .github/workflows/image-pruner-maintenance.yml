# Image pruner (maintenance): twice-yearly scan on develop — report only, no deletes.
#
# Runs the unreferenced-image scanner and uploads a CSV artifact. If the count
# exceeds the alert threshold, opens a GitHub issue for the docs team to run
# @image-pruner and open [IP] batch PRs manually. CI never deletes images.
#
# Schedule: June 1 and December 1 at 10:00 America/New_York (IANA timezone).
# See: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
#
# Skill: .github/skills/image-pruner/SKILL.md
name: Image pruner (maintenance)

on:
  schedule:
    - cron: "0 10 1 6 *"
      timezone: "America/New_York"
    - cron: "0 10 1 12 *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      alert_threshold:
        description: "Open a GitHub issue when unreferenced count is at or above this number."
        required: false
        default: "20"
        type: string

permissions:
  contents: read
  issues: write

env:
  ALERT_THRESHOLD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.alert_threshold != '' && github.event.inputs.alert_threshold || '20' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unreferenced image scan
        id: scan
        env:
          SCAN_LOG: ${{ runner.temp }}/scan.log
          SCAN_CSV: ${{ runner.temp }}/unreferenced_images.csv
        run: |
          python3 scripts/image-pruner/find_unreferenced_images.py --csv "$SCAN_CSV" | tee "$SCAN_LOG"

          count=$(python3 -c "
          import os, re
          text = open(os.environ['SCAN_LOG']).read()
          m = re.search(r'Unreferenced \(deletable\):\s+(\d+)', text)
          print(m.group(1) if m else '0')
          ")

          bytes_human=$(python3 -c "
          import os, re
          text = open(os.environ['SCAN_LOG']).read()
          m = re.search(r'Unreferenced \(deletable\):\s+\d+\s+\(([^)]+)\)', text)
          print(m.group(1) if m else 'unknown')
          ")

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "bytes_human=$bytes_human" >> "$GITHUB_OUTPUT"

      - name: Upload scan CSV
        uses: actions/upload-artifact@v7
        with:
          name: image-pruner-unreferenced-${{ github.run_id }}
          path: ${{ runner.temp }}/unreferenced_images.csv
          if-no-files-found: error

      - name: Date stamp (Eastern)
        id: stamp
        run: echo "ymd=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        run: |
          {
            echo "## Image pruner maintenance scan"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Date | ${{ steps.stamp.outputs.ymd }} |"
            echo "| Unreferenced images | ${{ steps.scan.outputs.count }} |"
            echo "| Approx. size | ${{ steps.scan.outputs.bytes_human }} |"
            echo "| Alert threshold | ${ALERT_THRESHOLD} |"
            echo ""
            echo "CSV attached as workflow artifact \`image-pruner-unreferenced-${{ github.run_id }}\`."
            echo ""
            if [ "${{ steps.scan.outputs.count }}" -ge "${ALERT_THRESHOLD}" ]; then
              echo "**Action:** A GitHub issue was opened for docs triage. Run \`@image-pruner\` to review the CSV and open \`[IP]\` batch PRs."
            else
              echo "**Status:** Within maintenance baseline. No issue opened."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open maintenance issue
        if: ${{ fromJSON(steps.scan.outputs.count) >= fromJSON(env.ALERT_THRESHOLD) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ runner.temp }}/issue-body.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_DATE: ${{ steps.stamp.outputs.ymd }}
          SCAN_COUNT: ${{ steps.scan.outputs.count }}
          SCAN_BYTES: ${{ steps.scan.outputs.bytes_human }}
          ARTIFACT_NAME: image-pruner-unreferenced-${{ github.run_id }}
        run: |
          title="[IP] Image prune maintenance — ${SCAN_COUNT} unreferenced images (${SCAN_DATE})"
          {
            echo "## Image Pruning (scheduled maintenance)"
            echo ""
            echo "This issue was **opened automatically** by the [Image pruner (maintenance)](${RUN_URL}) workflow."
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Scan date | ${SCAN_DATE} |"
            echo "| Unreferenced images | ${SCAN_COUNT} |"
            echo "| Approx. size | ${SCAN_BYTES} |"
            echo "| Alert threshold | ${ALERT_THRESHOLD} |"
            echo ""
            echo "### Next steps"
            echo ""
            echo "1. Download the CSV from the workflow run artifact \`${ARTIFACT_NAME}\`."
            echo "2. Review candidates (see [high-risk patterns](.github/skills/image-pruner/SKILL.md#high-risk-path-patterns) in the image-pruner skill)."
            echo "3. Run \`@image-pruner\` (or follow the skill manually) to open \`[IP]\` batch PRs — **up to 100 deletions per PR**, with secondary verification. CI does **not** delete images."
            echo ""
            echo "### Maintenance baseline"
            echo ""
            echo "After the initial bulk cleanup, a small remainder (for example Komo v2 assets with spaces in the path) may appear unreferenced in the primary scan but are kept by secondary verification. Treat **sustained counts above ${ALERT_THRESHOLD}** as signal to prune; re-tune the threshold in \`.github/workflows/image-pruner-maintenance.yml\` if needed."
            echo ""
            echo "### Scan commands"
            echo ""
            echo '```bash'
            echo 'python3 scripts/image-pruner/find_unreferenced_images.py \'
            echo '  --csv scripts/image-pruner/unreferenced_images.csv'
            echo '```'
          } > "$ISSUE_BODY"
          gh issue create --title "$title" --body-file "$ISSUE_BODY"
