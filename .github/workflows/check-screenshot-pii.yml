# Checks added or modified screenshots under assets/img/ for likely PII (external IDs,
# customer attribute names, production CSV previews, real email addresses).
#
# BLOCKING: this check must pass before merging. On failure, upserts a PR comment with
# file paths, matched text, and fix guidance. On a clean pass, deletes prior bot comments.
# Partial fixes strike through cleared findings and note how they were resolved.
#
# False positives
#   1. Add a sidecar file next to the image:
#        assets/img/path/to/image.png.pii-audit-dismiss.json
#      with a documented "reason" and optional dismiss_ids / dismiss_all.
#      Sidecar-only PRs do not list this path below so the workflow is not scheduled
#      when no raster images changed (the job only scans png/jpg/jpeg in the diff).
#   2. A maintainer may add the pii-audit-dismissed label after reviewing the sidecar
#      or confirming the finding is safe. The workflow still posts an audit comment.
#
# Run locally:
#   brew install tesseract   # macOS
#   python3 scripts/check_screenshot_pii.py assets/img/path/to/image.png
#
# CI installs Tesseract via apt with bounded timeouts and retries so a stuck mirror
# does not leave the job running indefinitely.
#
# Incremental skip (synchronize only): when this push does not change any image,
# dismiss sidecar, scanner, or this workflow file, and the *previous* PR head commit
# already has a successful run of this job, Tesseract + OCR are skipped. If the
# prior run failed or is missing, the scanner runs so a doc-only push cannot clear
# a blocking failure. PR comments are left unchanged on skip.
#
# Cursor skill:
#   @screenshot-pii-audit

name: Check screenshot PII

on:
  pull_request:
    # Only schedule when raster screenshots or scanner inputs change — not when a PR
    # only adds/updates `.pii-audit-dismiss.json` sidecars (those are consumed on the
    # next run that includes changed images).
    paths:
      - 'assets/img/**/*.png'
      - 'assets/img/**/*.jpg'
      - 'assets/img/**/*.jpeg'
      - 'scripts/check_screenshot_pii.py'
      - 'scripts/pii_name_lexicon.py'
      - '.github/workflows/check-screenshot-pii.yml'

# Superseded re-runs (e.g. apt install or scanner step retries) should not pile up.
concurrency:
  group: screenshot-pii-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  check-screenshot-pii:
    name: Screenshot PII audit (changed images)
    # Pinned runner + job timeout: avoid indefinite hangs when apt mirrors stall.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch for three-dot diff
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Decide whether to run scanner (incremental skip)
        id: gate
        uses: actions/github-script@v9
        env:
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');

            const checkJobName = 'Screenshot PII audit (changed images)';
            let heavy = 'true';
            let reason = 'default';

            try {
              const action = process.env.EVENT_ACTION || '';
              const before = (process.env.BEFORE_SHA || '').trim();
              const after = (process.env.AFTER_SHA || '').trim();

              if (action !== 'synchronize') {
                reason = `action=${action}`;
              } else if (!before || /^0+$/.test(before)) {
                reason = 'no-valid-before-sha';
              } else if (!after || before === after) {
                reason = 'no-after-or-same-as-before';
              } else {
                let diffRaw = '';
                try {
                  diffRaw = execSync(
                    `git diff --name-only ${before}..${after} -- assets/img scripts/check_screenshot_pii.py scripts/pii_name_lexicon.py .github/workflows/check-screenshot-pii.yml`,
                    { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 },
                  ).trim();
                } catch (e) {
                  reason = `git-diff-failed:${e.message}`;
                  diffRaw = '';
                }

                if (reason === 'default') {
                  const lines = diffRaw ? diffRaw.split(/\r?\n/) : [];
                  const relevant = lines.filter((f) => {
                    if (!f) return false;
                    if (f === 'scripts/check_screenshot_pii.py') return true;
                    if (f === 'scripts/pii_name_lexicon.py') return true;
                    if (f === '.github/workflows/check-screenshot-pii.yml') return true;
                    if (!f.startsWith('assets/img/')) return false;
                    if (/\.pii-audit-dismiss\.json$/i.test(f)) return true;
                    return /\.(png|jpg|jpeg)$/i.test(f);
                  });

                  if (relevant.length > 0) {
                    reason = `delta:${relevant.length}-relevant-files`;
                  } else {
                    const { owner, repo } = context.repo;
                    let runs = [];
                    try {
                      const resp = await github.rest.checks.listForRef({
                        owner,
                        repo,
                        ref: before,
                        check_name: checkJobName,
                        per_page: 20,
                      });
                      runs = resp.data.check_runs || [];
                    } catch (e) {
                      reason = `checks-api-failed:${e.message}`;
                      runs = [];
                    }

                    if (reason === 'default') {
                      const sorted = [...runs].sort(
                        (a, b) =>
                          new Date(b.started_at || 0) - new Date(a.started_at || 0),
                      );
                      const latest = sorted[0];
                      if (!latest || latest.conclusion !== 'success') {
                        reason = `prior-check-not-success:${latest?.conclusion || 'none'}`;
                      } else {
                        heavy = 'false';
                        reason = 'incremental-skip-doc-only-prior-success';
                      }
                    }
                  }
                }
              }
            } catch (e) {
              heavy = 'true';
              reason = `gate-error:${e.message}`;
            }

            core.setOutput('heavy', heavy);
            core.setOutput('reason', reason);
            core.info(`PII gate: heavy=${heavy} (${reason})`);

      - name: Install Tesseract OCR
        if: steps.gate.outputs.heavy != 'false'
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euxo pipefail
          # apt occasionally hangs on hosted runners; bounded timeouts + retries fail fast
          # instead of blocking the job for hours on `apt-get update`.
          for attempt in 1 2 3; do
            echo "Tesseract install attempt ${attempt}/3"
            if sudo apt-get update -y \
                -o Acquire::http::Timeout=120 \
                -o Acquire::https::Timeout=120 \
                -o Acquire::Retries=5 \
              && sudo apt-get install -y \
                -o Acquire::http::Timeout=120 \
                -o Acquire::https::Timeout=120 \
                -o Acquire::Retries=5 \
                --no-install-recommends \
                tesseract-ocr; then
              tesseract --version
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "apt failed on attempt ${attempt}; sleeping 30s before retry..."
              sleep 30
            fi
          done
          echo "apt-get could not install tesseract-ocr after 3 attempts"
          exit 1

      - name: Get changed image files
        id: changed
        if: steps.gate.outputs.heavy != 'false'
        shell: bash
        run: |
          BASE="origin/${{ github.base_ref }}"
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMRT "$BASE"...HEAD \
              -- 'assets/img/**' \
            | grep -E '\.(png|jpg|jpeg)$' \
            || true
          )
          if ((${#FILES[@]} == 0)); then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "No changed image files to check."
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${FILES[@]}" > /tmp/changed_images.txt
          echo "Checking ${#FILES[@]} image(s):"
          printf '  %s\n' "${FILES[@]}"

      - name: Check labels for maintainer dismissal
        id: labels
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const dismissed = labels.includes('pii-audit-dismissed');
            core.setOutput('dismissed', dismissed ? 'true' : 'false');

      - name: Check screenshot PII
        id: lint
        if: steps.gate.outputs.heavy != 'false' && steps.changed.outputs.ran == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mapfile -t FILES < /tmp/changed_images.txt
          python3 scripts/check_screenshot_pii.py \
            --json violations.json \
            "${FILES[@]}" 2>&1 | tee lint-output.txt
          LINT_EXIT=${PIPESTATUS[0]}
          echo "exit_code=${LINT_EXIT}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit GitHub annotations for violations
        if: >-
          steps.gate.outputs.heavy != 'false'
          && steps.changed.outputs.ran == 'true'
          && steps.lint.outputs.exit_code == '1'
          && steps.labels.outputs.dismissed != 'true'
        shell: bash
        run: python3 scripts/check_screenshot_pii.py --github-annotations violations.json

      - name: Upload violations artifact
        if: always() && steps.gate.outputs.heavy != 'false' && steps.changed.outputs.ran == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-pii-violations-pr${{ github.event.pull_request.number }}-run${{ github.run_number }}
          path: violations.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Sync screenshot PII PR comments
        if: always() && steps.gate.outputs.heavy != 'false'
        uses: actions/github-script@v9
        env:
          RAN: ${{ steps.changed.outputs.ran }}
          LINT_EXIT_CODE: ${{ steps.lint.outputs.exit_code }}
          LABEL_DISMISSED: ${{ steps.labels.outputs.dismissed }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const FAILURE_MARKER = '<!-- braze-docs-screenshot-pii-bot -->';
            const DISMISSED_MARKER = '<!-- braze-docs-screenshot-pii-dismissed-bot -->';

            const typeNames = {
              numeric_user_id: 'Numeric user identifier',
              alphanumeric_external_id: 'Alphanumeric external_id value',
              customer_attribute_name: 'Customer-specific attribute name',
              production_csv_filename: 'Production-style CSV filename',
              email_address: 'Email address',
              person_name: 'Person name (review required)',
              person_name_single: 'Person name in Name/Name_Last column (review required)',
            };

            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const ran = process.env.RAN === 'true';
            const exitCode = process.env.LINT_EXIT_CODE || '0';
            const labelDismissed = process.env.LABEL_DISMISSED === 'true';
            const headSha = (process.env.HEAD_SHA || '').slice(0, 7);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });

            const findComment = (marker) =>
              comments.find(c => c.body && c.body.includes(marker));

            const deleteComment = async (comment) => {
              if (!comment) return;
              await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              core.info(`Deleted comment ${comment.id}`);
            };

            const parseEntriesFromComment = (body) => {
              const entries = new Map();
              const re = /- (?:~~)?\*\*\[([a-f0-9]{8})\] ([^*]+)\*\* — matched `([^`]+)`/g;
              let match;
              while ((match = re.exec(body)) !== null) {
                entries.set(match[1], {
                  id: match[1],
                  label: match[2].trim(),
                  matchText: match[3],
                });
              }
              return entries;
            };

            let violations = [];
            if (ran && fs.existsSync('violations.json')) {
              try {
                violations = JSON.parse(fs.readFileSync('violations.json', 'utf8'));
              } catch (e) {
                core.warning('Could not read violations.json: ' + e.message);
              }
            }

            const active = violations.filter(v => !v.dismissed);
            const sidecarDismissed = violations.filter(v => v.dismissed);

            // Scanner error — do not treat as a clean pass.
            if (ran && exitCode === '2') {
              const lines = [FAILURE_MARKER, ''];
              lines.push('### Blocked: screenshot PII audit could not complete');
              lines.push('');
              lines.push(
                'The scanner exited with an error (for example, malformed `.pii-audit-dismiss.json` ' +
                'or a missing dependency). This check is **blocking** until the error is fixed.'
              );
              lines.push('');
              if (fs.existsSync('lint-output.txt')) {
                const output = fs.readFileSync('lint-output.txt', 'utf8').trim().slice(0, 4000);
                if (output) {
                  lines.push('<details><summary>Scanner output</summary>');
                  lines.push('');
                  lines.push('```');
                  lines.push(output);
                  lines.push('```');
                  lines.push('</details>');
                }
              }
              const body = lines.join('\n');
              const existingFailure = findComment(FAILURE_MARKER);
              if (existingFailure) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existingFailure.id, body,
                });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
              return;
            }

            const isCleanPass = !ran || exitCode === '0';

            // Full pass — delete all bot comments (including when images were removed from the PR).
            if (isCleanPass) {
              await deleteComment(findComment(FAILURE_MARKER));
              await deleteComment(findComment(DISMISSED_MARKER));
              core.info('Screenshot PII audit passed — removed prior bot comments.');
              return;
            }

            const existingFailure = findComment(FAILURE_MARKER);
            const previousEntries = existingFailure
              ? parseEntriesFromComment(existingFailure.body)
              : new Map();
            const currentIds = new Set(violations.map(v => v.id));

            const clearedFromPrevious = [...previousEntries.keys()].filter(id => !currentIds.has(id));

            // Maintainer label override — audit comment only; remove blocking failure comment.
            if (labelDismissed && active.length > 0) {
              await deleteComment(existingFailure);

              const lines = [DISMISSED_MARKER, ''];
              lines.push('### Audit: screenshot PII check dismissed by label');
              lines.push('');
              lines.push(
                'The `pii-audit-dismissed` label is present. **Merge is allowed**, but the following ' +
                'findings were not auto-cleared — confirm they are safe to publish:'
              );
              lines.push('');
              for (const v of active) {
                lines.push(`- \`${v.file}\` [${v.id}] ${v.violation_type}: \`${v.match}\``);
              }
              lines.push('');
              lines.push('_Remove the label and fix the images if this dismissal was applied in error._');

              const body = lines.join('\n');
              const existingDismissed = findComment(DISMISSED_MARKER);
              if (existingDismissed) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existingDismissed.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber, body,
                });
              }
              return;
            }

            await deleteComment(findComment(DISMISSED_MARKER));

            if (active.length === 0) {
              await deleteComment(existingFailure);
              return;
            }

            const lines = [FAILURE_MARKER, ''];
            lines.push('### Blocked: screenshot PII audit failed');
            lines.push('');
            lines.push(
              `**${active.length} potential PII finding(s)** in changed screenshots. ` +
              'This check is **blocking** — fix the images or document a false positive before merging.'
            );
            lines.push('');

            const clearedLines = [];

            for (const v of sidecarDismissed) {
              const label = typeNames[v.violation_type] || v.violation_type;
              clearedLines.push(
                `- ~~**[${v.id}] ${label}** — matched \`${v.match}\`~~ — ` +
                `Dismissed via \`.pii-audit-dismiss.json\`: ${v.dismiss_reason}`
              );
            }

            for (const id of clearedFromPrevious) {
              const entry = previousEntries.get(id);
              if (!entry) continue;
              clearedLines.push(
                `- ~~**[${entry.id}] ${entry.label}** — matched \`${entry.matchText}\`~~ — ` +
                `Resolved in commit \`${headSha}\` (image updated or removed from PR).`
              );
            }

            if (clearedLines.length > 0) {
              lines.push('#### Cleared since last run');
              lines.push('');
              lines.push(...clearedLines);
              lines.push('');
            }

            lines.push('**Fix options:**');
            lines.push('1. Retake screenshots from [dashboard-06](https://dashboard-06.braze.com/) using FakeBrandz fixture data.');
            lines.push('2. Blur identifier columns, preview rows, person names, and customer-specific attribute names.');
            lines.push('3. For **example/fictional names** already allowed by the style guide, add a sidecar (see below) — do not skip review.');
            lines.push('4. For false positives, add a sidecar file next to the image:');
            lines.push('   `assets/img/your-image.png.pii-audit-dismiss.json`');
            lines.push('   ```json');
            lines.push('   {');
            lines.push('     "reason": "Explain why this is safe to publish (audit trail)",');
            lines.push('     "dismiss_ids": ["abc12345"]');
            lines.push('   }');
            lines.push('   ```');
            lines.push('5. After review, a maintainer may add the `pii-audit-dismissed` label to override remaining findings.');
            lines.push('');
            lines.push('Run locally: `python3 scripts/check_screenshot_pii.py <image-path>`');
            lines.push('Cursor: `@screenshot-pii-audit`');
            lines.push('');
            lines.push('#### Active findings');
            lines.push('');

            const byFile = {};
            for (const v of active) {
              if (!byFile[v.file]) byFile[v.file] = [];
              byFile[v.file].push(v);
            }

            for (const [file, fileViolations] of Object.entries(byFile).sort()) {
              lines.push(`##### \`${file}\``);
              lines.push('');
              for (const v of fileViolations) {
                const label = typeNames[v.violation_type] || v.violation_type;
                lines.push(`- **[${v.id}] ${label}** — matched \`${v.match}\``);
                lines.push(`  - ${v.fix_hint}`);
              }
              lines.push('');
            }

            const body = lines.join('\n');
            if (existingFailure) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existingFailure.id, body,
              });
              core.info(`Updated screenshot PII comment ${existingFailure.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              core.info('Created screenshot PII comment');
            }

      - name: PII scan skipped on this sync (incremental)
        if: success() && steps.gate.outputs.heavy == 'false'
        run: |
          echo "Skipping Tesseract + OCR for this sync (no image/scanner delta)."
          echo "Gate: ${{ steps.gate.outputs.reason }}"

      - name: Fail job if violations remain, scanner errors, and not dismissed
        if: >-
          steps.gate.outputs.heavy != 'false'
          && steps.changed.outputs.ran == 'true'
          && (steps.lint.outputs.exit_code == '1' || steps.lint.outputs.exit_code == '2')
          && steps.labels.outputs.dismissed != 'true'
        run: |
          if [ "${{ steps.lint.outputs.exit_code }}" = "2" ]; then
            echo "Screenshot PII audit could not complete due to a scanner error."
          else
            echo "Screenshot PII audit failed. Fix images or add a documented dismissal."
          fi
          exit 1
