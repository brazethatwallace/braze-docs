<!DOCTYPE html>
<html lang="{{site.language}}">
<head>
  <meta charset="utf-8">
  <title>Braze</title>
  {% assign redirect_target = page.redirect_to | multi_lang | public_doc_path %}
    <link rel="canonical" href="{{ redirect_target }}">
    <script type="text/text/javascript">
    var redirected_count = parseInt(query_params.get('redirected'),10) || 0;
    redirected_count++;
    </script>
    <script type="text/javascript">window.location="{{ redirect_target }}?redirected=" + redirected_count</script>
    <meta http-equiv="refresh" content="0; url={{ redirect_target }}">
    <meta name="robots" content="noindex">
</head>
