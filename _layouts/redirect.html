<!DOCTYPE html>
<html lang="{{site.language}}">
<head>
  <meta charset="utf-8">
  <title>Braze</title>
  {% assign redirect_target = page.redirect_to | multi_lang | public_doc_path %}
    <link rel="canonical" href="{{ redirect_target }}">
    <script type="text/javascript">
    var query_params = new URLSearchParams(window.location.search);
    var redirected_count = parseInt(query_params.get('redirected'), 10) || 0;
    redirected_count++;

    var redirect_target = "{{ redirect_target }}";
    var hash_idx = redirect_target.indexOf('#');
    var base = hash_idx >= 0 ? redirect_target.slice(0, hash_idx) : redirect_target;
    var fragment = hash_idx >= 0 ? redirect_target.slice(hash_idx + 1) : '';
    var separator = base.indexOf('?') >= 0 ? '&' : '?';
    var location = base + separator + 'redirected=' + redirected_count;
    if (fragment) {
      location += '#' + fragment;
    }
    window.location = location;
    </script>
    <meta http-equiv="refresh" content="0; url={{ redirect_target }}">
    <meta name="robots" content="noindex">
</head>
